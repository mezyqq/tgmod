name: Build mod IPA

on:
  workflow_dispatch:
  push:
    branches: [ mod ]

concurrency:
  group: mod-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          fi
          xcodebuild -version

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            # Compile check only: the app builds, but logging in will not work.
            echo "::warning::TG_API_ID / TG_API_HASH secrets are not set (https://my.telegram.org/apps), building with placeholder keys"
            TG_API_ID=1
            TG_API_HASH=00000000000000000000000000000000
          fi
          # bundle_id / team_id must match build-system/fake-codesigning profiles;
          # the sideloading tool re-signs the app with your own identity.
          cat > "$RUNNER_TEMP/configuration.json" <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "$TG_API_ID",
            "api_hash": "$TG_API_HASH",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false,
            "sg_config": ""
          }
          EOF

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ hashFiles('versions.json') }}-

      - name: Build
        run: |
          set -x
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="$RUNNER_TEMP/configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${{ github.run_number }}"
          mkdir -p artifacts
          cp bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa artifacts/Mod.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mod-ipa-${{ github.run_number }}
          path: artifacts/Mod.ipa
          retention-days: 14

      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          git log -1 --pretty=%B > "$RUNNER_TEMP/notes.txt"
          gh release create "$TAG" artifacts/Mod.ipa --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Mod $VERSION (${{ github.run_number }})" --notes-file "$RUNNER_TEMP/notes.txt" --latest
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/Mod.ipa" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Send release to Telegram
        if: env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        run: |
          bash tools/mod-notify-telegram.sh artifacts/Mod.ipa "${{ steps.release.outputs.url }}" \
            "✅ Новая сборка мода ${{ steps.release.outputs.version }} (${{ github.run_number }})
          $(git log -1 --pretty=%s)"

      - name: Report failure to Telegram
        if: failure() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        run: |
          curl -sS "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT_ID" \
            --data-urlencode text="❌ Сборка ${{ github.run_number }} упала: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
